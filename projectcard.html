<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-12 | Project Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="adminlte.css" />
<link rel="stylesheet" href="custom.css"/>
<link rel="stylesheet" href="projectcard.css"/>

</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

<!-- ================= NAVBAR ================= -->
<nav class="app-header navbar navbar-expand bg-body">

  <div class="container-fluid">

    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-lte-toggle="sidebar" href="#">
          <i class="bi bi-list"></i>
        </a>
      </li>

      <li class="nav-item d-none d-md-block">
        <form class="d-flex ms-2">
          <div class="input-group input-group-sm">
            <input class="form-control" type="search" placeholder="Search menu..." />
            <button class="btn btn-primary">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </li>
    </ul>

    <ul class="navbar-nav ms-auto">

      <li class="nav-item">
        <a class="nav-link" href="#" id="themeToggle">
          <i class="bi bi-moon-fill"></i>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link">
          <i class="bi bi-bell-fill"></i>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" data-lte-toggle="fullscreen">
          <i class="bi bi-arrows-fullscreen"></i>
        </a>
      </li>

      <li class="nav-item dropdown user-menu">
        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
               class="user-image rounded-circle shadow">
          <span class="d-none d-md-inline">Admin User</span>
        </a>
      </li>

    </ul>

  </div>
</nav>

<!-- ================= SIDEBAR ================= -->
<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

  <div class="sidebar-brand">
    <a href="#" class="brand-link">
      <img src="AdminLTELogo.png" class="brand-image opacity-75 shadow" />
      <span class="brand-text fw-semibold">Code Axis</span>
    </a>
  </div>

  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <ul class="nav sidebar-menu flex-column">
        <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-people"></i> Employees</a></li>
        <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-kanban"></i> Projects</a></li>
      </ul>
    </nav>
  </div>

</aside>

<!-- ================= CONTENT ================= -->
<main class="app-main">

<div class="container-fluid pt-3">

  <div class="page-header">
    <h1 class="page-title">Project Cards</h1>
    <p class="page-sub">Card Grid — Visual overview of all active projects</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="filter-chip active">All Projects</button>
      <button class="filter-chip">Active</button>
      <button class="filter-chip">In Progress</button>
      <button class="filter-chip">Review</button>
      <button class="filter-chip">On Hold</button>
    </div>

    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" placeholder="Search projects..." class="form-control form-control-sm">
      <button class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg"></i> New Project
      </button>
    </div>
  </div>

  <div class="projects-grid" id="projectGrid"></div>

</div>

</main>

</div>

<!-- ================= SCRIPT ================= -->
<script>
const projects=[
 {name:"Code Axis Dashboard",desc:"Analytics system",progress:87},
 {name:"E-Commerce Portal",desc:"Shopping system",progress:62},
 {name:"CRM Integration",desc:"Customer system",progress:35},
 {name:"AI Chatbot",desc:"Support bot",progress:48},
];

function render(){
  document.getElementById("projectGrid").innerHTML =
  projects.map(p=>`
    <div class="project-card">
      <h6>${p.name}</h6>
      <p>${p.desc}</p>
      <div class="progress">
        <div class="progress-bar" style="width:${p.progress}%">${p.progress}%</div>
      </div>
    </div>
  `).join('');
}
render();
</script>

<script src="adminlte.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
