<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Code Axis | Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- AdminLTE -->
  <link rel="stylesheet" href="adminlte.css" />
  <link rel="stylesheet" href="custom.css" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <!-- ApexCharts -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

  <!-- ================= NAVBAR (STATIC INCLUDE) ================= -->
  <div class="app-header navbar navbar-expand bg-body">

    <div class="container-fluid">

      <!-- Sidebar toggle -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#">
            <i class="bi bi-list"></i>
          </a>
        </li>
      </ul>

      <!-- Right -->
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" id="themeToggle">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </a>
        </li>

      </ul>

    </div>
  </div>

  <!-- ================= SIDEBAR (STATIC INCLUDE) ================= -->
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

    <div class="sidebar-brand">
      <a href="#" class="brand-link">
        <span class="brand-text fw-semibold">Code Axis</span>
      </a>
    </div>

    <div class="sidebar-wrapper">
      <nav class="mt-2">

        <ul class="nav sidebar-menu flex-column">

          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="nav-icon bi bi-speedometer2"></i>
              <p>Dashboard</p>
            </a>
          </li>

          <li class="nav-header">ANALYTICS</li>

          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="nav-icon bi bi-bar-chart"></i>
              <p>Reports</p>
            </a>
          </li>

        </ul>

      </nav>
    </div>

  </aside>

  <!-- ================= MAIN ================= -->
  <main class="app-main">

    <div class="app-content-header">
      <div class="container-fluid">
        <h3>Analytics & Reports</h3>
      </div>
    </div>

    <div class="app-content">
      <div class="container-fluid">

        <div class="row mb-4">

          <div class="col-lg-3 col-6">
            <div class="small-box text-bg-primary">
              <div class="inner">
                <h3>1240</h3>
                <p>Total Reports</p>
              </div>
            </div>
          </div>

        </div>

        <div class="row">

          <div class="col-lg-8">
            <div class="card">
              <div class="card-header">
                <h3>Trend</h3>
              </div>
              <div class="card-body">
                <div id="lineChart"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card">
              <div class="card-header">
                <h3>Status</h3>
              </div>
              <div class="card-body">
                <div id="donutChart"></div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

  </main>

</div>

<!-- ================= SCRIPTS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="adminlte.js"></script>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<!-- CHARTS -->
<script>
new ApexCharts(document.querySelector("#lineChart"), {
  series: [{
    name: "Reports",
    data: [10, 20, 15, 30, 25, 40, 35]
  }],
  chart: { type: "line", height: 300 },
  xaxis: { categories: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] }
}).render();

new ApexCharts(document.querySelector("#donutChart"), {
  series: [45, 25, 20, 10],
  labels: ["Done", "Pending", "Process", "Hold"],
  chart: { type: "donut", height: 300 }
}).render();
</script>

<!-- THEME -->
<script>
const toggle = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

toggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  icon.classList.toggle("bi-moon-fill");
  icon.classList.toggle("bi-sun-fill");
});
</script>

</body>
</html>
