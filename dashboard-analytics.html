<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Analytics Dashboard</title>

  <link rel="stylesheet" href="../css/adminlte.css">
  <link rel="stylesheet" href="../css/custom.css">
</head>

<body>

<div class="container-fluid p-3">

  <h3>Analytics Dashboard</h3>

  <div class="row mt-3">

    <div class="col-lg-4"><div class="card"><div class="card-body"><div id="revenue-chart"></div></div></div></div>

    <div class="col-lg-4"><div class="card"><div class="card-body"><div id="bar-chart"></div></div></div></div>

    <div class="col-lg-4"><div class="card"><div class="card-body"><div id="pie-chart"></div></div></div></div>

  </div>

  <div class="row mt-3">

    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h5>Project Performance</h5>
          <p>Analytics heavy dashboard section</p>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h5>User Growth</h5>
          <p>Monthly analytics summary</p>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="../js/custom.js"></script>

</body>
</html>
