<!-- ================= MAIN CONTENT ================= -->
<main class="app-main">

<div class="app-content">

  <div class="container-fluid">

    <!-- HEADER -->
    <div class="page-header">
      <h1 class="page-title">Project Cards</h1>
      <p class="page-sub">Visual overview of all projects</p>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="filter-chip active" onclick="filterCards('all',this)">All</button>
        <button class="filter-chip" onclick="filterCards('Active',this)">Active</button>
        <button class="filter-chip" onclick="filterCards('In Progress',this)">In Progress</button>
        <button class="filter-chip" onclick="filterCards('Review',this)">Review</button>
        <button class="filter-chip" onclick="filterCards('On Hold',this)">On Hold</button>
      </div>

      <div style="display:flex;gap:10px;align-items:center;">
        <input type="text" id="projectSearch" placeholder="Search..." oninput="applyFilters()">
        <button class="btn-primary"><i class="bi bi-plus-lg"></i> New Project</button>
      </div>
    </div>

    <!-- GRID -->
    <div class="projects-grid" id="projectGrid"></div>

  </div>

</div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
const projects = [
  {name:"Code Axis Dashboard",desc:"Analytics dashboard",status:"Active",progress:87,tasks:12,due:"Jun 30"},
  {name:"E-Commerce Portal",desc:"Shopping platform",status:"In Progress",progress:62,tasks:8,due:"Jul 15"},
  {name:"Mobile App",desc:"UI redesign",status:"Review",progress:95,tasks:5,due:"May 28"},
  {name:"CRM System",desc:"Salesforce integration",status:"On Hold",progress:35,tasks:14,due:"Aug 1"},
];

let active="all";

function render(data){
  document.getElementById("projectGrid").innerHTML =
  data.map(p=>`
    <div class="project-card">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>

      <div class="meta">
        <span>${p.status}</span>
        <span>${p.progress}%</span>
      </div>

      <div class="bar">
        <div class="fill" style="width:${p.progress}%"></div>
      </div>

      <div class="bottom">
        <span>Tasks: ${p.tasks}</span>
        <span>${p.due}</span>
      </div>
    </div>
  `).join("");
}

function filterCards(status,btn){
  active=status;
  document.querySelectorAll(".filter-chip").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters(){
  let data = active==="all" ? projects : projects.filter(p=>p.status===active);

  let q=document.getElementById("projectSearch").value.toLowerCase();
  if(q) data=data.filter(p=>p.name.toLowerCase().includes(q));

  render(data);
}

applyFilters();
  
</script>
