<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Code Axis | Project Cards</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
/>

<!-- AdminLTE -->
<link rel="stylesheet" href="adminlte.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="projectcard.css">

</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

  <!-- HEADER -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">

      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#">
            <i class="bi bi-list"></i>
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="bi bi-moon-fill"></i>
          </a>
        </li>
      </ul>

    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-link">

        <img
          src="AdminLTELogo.png"
          class="brand-image opacity-75 shadow"
          alt="logo"
        >

        <span class="brand-text fw-semibold">Code Axis</span>
      </a>
    </div>

    <div class="sidebar-wrapper">

      <nav class="mt-2">

        <ul class="nav sidebar-menu flex-column">

          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <i class="nav-icon bi bi-speedometer2"></i>
              <p>Dashboard</p>
            </a>
          </li>

          <li class="nav-header">PROJECT MANAGEMENT</li>

          <li class="nav-item">
            <a href="projectcard.html" class="nav-link active">
              <i class="nav-icon bi bi-kanban"></i>
              <p>Projects</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="employetable.html" class="nav-link">
              <i class="nav-icon bi bi-people"></i>
              <p>Employees</p>
            </a>
          </li>

        </ul>

      </nav>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="app-main">

    <div class="app-content-header">
      <div class="container-fluid">

        <div class="row">

          <div class="col-sm-6">
            <h3 class="mb-0">Projects</h3>
          </div>

          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-end">
              <li class="breadcrumb-item">
                <a href="dashboard.html">Home</a>
              </li>
              <li class="breadcrumb-item active">
                Projects
              </li>
            </ol>
          </div>

        </div>

      </div>
    </div>

    <!-- CONTENT -->
    <div class="app-content">

      <div class="container-fluid">

        <!-- TOOLBAR -->
        <div class="toolbar">

          <div class="toolbar-left">
            <button class="filter-chip active" onclick="filterCards('all',this)">All</button>
            <button class="filter-chip" onclick="filterCards('Active',this)">Active</button>
            <button class="filter-chip" onclick="filterCards('In Progress',this)">In Progress</button>
            <button class="filter-chip" onclick="filterCards('Review',this)">Review</button>
            <button class="filter-chip" onclick="filterCards('On Hold',this)">On Hold</button>
          </div>

          <div class="toolbar-right">
            <input
              type="text"
              id="projectSearch"
              placeholder="Search projects..."
              oninput="applyFilters()"
            >

            <button class="btn btn-primary" onclick="addProject()">
             <i class="bi bi-plus-lg"></i>
                New Project
             </button>
          </div>

        </div>

        <!-- GRID -->
        <div class="projects-grid" id="projectGrid"></div>

      </div>

    </div>

  </main>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- AdminLTE -->
<script src="adminlte.js"></script>

<!-- SCRIPT -->
<script>

const projects = [
  {
    name:"Code Axis Dashboard",
    desc:"Analytics dashboard",
    status:"Active",
    progress:87,
    tasks:12,
    due:"Jun 30"
  },

  {
    name:"E-Commerce Portal",
    desc:"Shopping platform",
    status:"In Progress",
    progress:62,
    tasks:8,
    due:"Jul 15"
  },

  {
    name:"Mobile App",
    desc:"UI redesign",
    status:"Review",
    progress:95,
    tasks:5,
    due:"May 28"
  },

  {
    name:"CRM System",
    desc:"Salesforce integration",
    status:"On Hold",
    progress:35,
    tasks:14,
    due:"Aug 1"
  },
];

let active = "all";

function render(data){

  document.getElementById("projectGrid").innerHTML =
  data.map(p => `

    <div class="project-card">

      <div class="card-top">

        <div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
        </div>

        <span class="status">${p.status}</span>

      </div>

      <div class="meta">

        <span>
          <i class="bi bi-list-task"></i>
          ${p.tasks} Tasks
        </span>

        <span>${p.progress}%</span>

      </div>

      <div class="bar">
        <div class="fill" style="width:${p.progress}%"></div>
      </div>

      <div class="bottom">

        <span>
          <i class="bi bi-calendar-event"></i>
          ${p.due}
        </span>

      </div>

    </div>

  `).join("");
}

function filterCards(status,btn){

  active = status;

  document
    .querySelectorAll(".filter-chip")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  applyFilters();
  function addProject(){

  const name = prompt("Enter project name:");
  if(!name) return;

  const desc = prompt("Enter project description:");
  if(!desc) return;

  const status = prompt(
    "Enter status:\nActive\nIn Progress\nReview\nOn Hold"
  );

  if(!status) return;

  const progress = prompt("Enter progress percentage:");
  if(!progress) return;

  const tasks = prompt("Enter number of tasks:");
  if(!tasks) return;

  const due = prompt("Enter due date:");
  if(!due) return;

  projects.push({
    name:name,
    desc:desc,
    status:status,
    progress:Number(progress),
    tasks:Number(tasks),
    due:due
  });

  applyFilters();
}
}

function applyFilters(){

  let data =
    active === "all"
    ? projects
    : projects.filter(p => p.status === active);

  let q =
    document
    .getElementById("projectSearch")
    .value
    .toLowerCase();

  if(q){
    data = data.filter(p =>
      p.name.toLowerCase().includes(q)
    );
  }

  render(data);
}

applyFilters();

</script>

</body>
</html>
