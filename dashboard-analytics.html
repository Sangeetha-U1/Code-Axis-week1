<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Code Axis | Analytics & Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- AdminLTE CSS -->
  <link rel="stylesheet" href="adminlte.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="custom.css" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <!-- ApexCharts -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

  <div class="app-wrapper">

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- MAIN -->
    <main class="app-main">

      <div class="app-content-header">
        <div class="container-fluid">
          <h3>Analytics & Reports</h3>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">

          <!-- KPI -->
          <div class="row mb-4">

            <div class="col-lg-3 col-6">
              <div class="small-box text-bg-primary">
                <div class="inner">
                  <h3>1,240</h3>
                  <p>Total Reports</p>
                </div>
                <i class="bi bi-file-bar-graph icon"></i>
              </div>
            </div>

            <div class="col-lg-3 col-6">
              <div class="small-box text-bg-success">
                <div class="inner">
                  <h3>87%</h3>
                  <p>Accuracy</p>
                </div>
                <i class="bi bi-check-circle icon"></i>
              </div>
            </div>

            <div class="col-lg-3 col-6">
              <div class="small-box text-bg-warning">
                <div class="inner">
                  <h3>320</h3>
                  <p>Generated</p>
                </div>
                <i class="bi bi-graph-up icon"></i>
              </div>
            </div>

            <div class="col-lg-3 col-6">
              <div class="small-box text-bg-danger">
                <div class="inner">
                  <h3>12</h3>
                  <p>Pending</p>
                </div>
                <i class="bi bi-hourglass"></i>
              </div>
            </div>

          </div>

          <!-- CHARTS -->
          <div class="row">

            <div class="col-lg-8">
              <div class="card">
                <div class="card-header">
                  <h3>Trend Analysis</h3>
                </div>
                <div class="card-body">
                  <div id="lineChart"></div>
                </div>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="card">
                <div class="card-header">
                  <h3>Status</h3>
                </div>
                <div class="card-body">
                  <div id="donutChart"></div>
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>

    </main>

  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AdminLTE JS -->
  <script src="adminlte.js"></script>

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <!-- LOAD NAVBAR + SIDEBAR -->
  <script>
    Promise.all([
      fetch("navbar.html").then(res => res.text()),
      fetch("sidebar.html").then(res => res.text())
    ])
      .then(([navbar, sidebar]) => {

        document.getElementById("navbar-container").innerHTML = navbar;
        document.getElementById("sidebar-container").innerHTML = sidebar;

        // load custom.js AFTER components loaded
        const script = document.createElement("script");
        script.src = "custom.js";
        document.body.appendChild(script);

      });
  </script>

  <!-- CHARTS -->
  <script>

    new ApexCharts(document.querySelector("#lineChart"), {
      series: [{
        name: "Reports",
        data: [10, 20, 15, 30, 25, 40, 35]
      }],
      chart: {
        type: "line",
        height: 300
      },
      xaxis: {
        categories: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
      }
    }).render();


    new ApexCharts(document.querySelector("#donutChart"), {
      series: [45, 25, 20, 10],
      labels: ["Done", "Pending", "Process", "Hold"],
      chart: {
        type: "donut",
        height: 300
      }
    }).render();

  </script>

</body>

</html>
