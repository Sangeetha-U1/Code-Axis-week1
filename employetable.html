<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Table</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="employetable.css">
</head>

<body>


    <div class="container-fluid">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">Employee Table</h4>
        <span id="topDate"></span>
      </div>

      <!-- STATS -->
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card p-3">Total: <span id="sc-total">3</span></div></div>
        <div class="col-md-3"><div class="card p-3">Active: <span id="sc-active">1</span></div></div>
        <div class="col-md-3"><div class="card p-3">Working: <span id="sc-working">1</span></div></div>
        <div class="col-md-3"><div class="card p-3">Pending: <span id="sc-pending">1</span></div></div>
      </div>

      <!-- TABLE -->
      <div class="card p-3">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Employee</th>
              <th>Department</th>
              <th>Status</th>
              <th>Email</th>
            </tr>
          </thead>

          <tbody id="empTableBody">
            <tr data-name="sangeetha" data-dept="ui design" data-status="active">
              <td>01</td>
              <td>Sangeetha</td>
              <td>UI Design</td>
              <td>Active</td>
              <td>sangeetha@gmail.com</td>
            </tr>

            <tr data-name="praveen" data-dept="frontend" data-status="working">
              <td>02</td>
              <td>Praveen</td>
              <td>Frontend</td>
              <td>Working</td>
              <td>praveen@gmail.com</td>
            </tr>

            <tr data-name="raghuram" data-dept="developer" data-status="pending">
              <td>03</td>
              <td>Raghuram</td>
              <td>Developer</td>
              <td>Pending</td>
              <td>raghu@gmail.com</td>
            </tr>
          </tbody>
        </table>
      </div>

</div>
</body>
</html>
