<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Employee Table</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="adminlte.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="employetable.css">

</head>

<body class="hold-transition sidebar-mini layout-fixed layout-navbar-fixed">

<div class="wrapper">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Content Wrapper -->
  <div class="content-wrapper">

    <!-- Content Header -->
    <section class="content-header">
      <div class="container-fluid">

        <div class="topbar d-flex justify-content-between align-items-center">

          <div class="d-flex align-items-center gap-2">
            <span class="topbar-title fs-4 fw-bold">
              Employee Table
            </span>
          </div>

          <div>
            <span class="text-muted small" id="topDate"></span>
          </div>

        </div>

      </div>
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">

        <div class="page">

          <!-- Stats -->
          <div class="row g-3 mb-4">

            <div class="col-md-3">
              <div class="card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                  <i class="bi bi-people-fill fs-2 text-primary"></i>

                  <div>
                    <h4 id="sc-total">3</h4>
                    <small>Total Employees</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                  <i class="bi bi-check-circle-fill fs-2 text-success"></i>

                  <div>
                    <h4 id="sc-active">1</h4>
                    <small>Active</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                  <i class="bi bi-arrow-repeat fs-2 text-info"></i>

                  <div>
                    <h4 id="sc-working">1</h4>
                    <small>Working</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="card shadow-sm">
                <div class="card-body d-flex align-items-center gap-3">
                  <i class="bi bi-clock-fill fs-2 text-warning"></i>

                  <div>
                    <h4 id="sc-pending">1</h4>
                    <small>Pending</small>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- Table Card -->
          <div class="card shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">

              <h3 class="card-title">
                Employee Table
              </h3>

              <div class="d-flex gap-2">

                <button class="btn btn-primary btn-sm">
                  <i class="bi bi-plus-circle"></i>
                  Add Employee
                </button>

                <button class="btn btn-warning btn-sm">
                  <i class="bi bi-pencil-square"></i>
                  Edit Employee
                </button>

              </div>

            </div>

            <div class="card-body">

              <!-- Filters -->
              <div class="row g-2 mb-4">

                <div class="col-md-5">
                  <input type="text"
                         id="empSearch"
                         class="form-control"
                         placeholder="🔍 Search employee...">
                </div>

                <div class="col-md-3">
                  <select id="empDeptFilter" class="form-select">
                    <option value="all">All Departments</option>
                    <option value="ui design">UI Design</option>
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="developer">Developer</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <select id="empStatusFilter" class="form-select">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="working">Working</option>
                    <option value="pending">Pending</option>
                  </select>
                </div>

              </div>

              <!-- Table -->
              <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                  <thead class="table-light">
                    <tr>
                      <th>#</th>
                      <th>Employee</th>
                      <th>Department</th>
                      <th>Status</th>
                      <th>Email</th>
                      <th>Actions</th>
                    </tr>
                  </thead>

                  <tbody id="empTableBody">

                    <tr>
                      <td>1</td>
                      <td>Rahul</td>
                      <td>Frontend</td>
                      <td>
                        <span class="badge bg-success">
                          Active
                        </span>
                      </td>
                      <td>rahul@gmail.com</td>
                      <td>
                        <button class="btn btn-sm btn-danger">
                          Delete
                        </button>
                      </td>
                    </tr>

                  </tbody>

                </table>

              </div>

            </div>

          </div>

        </div>

      </div>
    </section>

  </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- AdminLTE -->
<script src="adminlte.js"></script>

<!-- Load Navbar + Sidebar -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  Promise.all([
    fetch("navbar.html").then(r => r.text()),
    fetch("sidebar.html").then(r => r.text())
  ])
  .then(([navbar, sidebar]) => {

    document.getElementById("navbar").innerHTML = navbar;

    document.getElementById("sidebar").innerHTML = sidebar;

  });

  // Top Date
  document.getElementById("topDate").textContent =
    new Date().toLocaleDateString('en-IN', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

});
</script>

</body>
</html>
