<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Code Axis | Analytics & Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- AdminLTE -->
  <link rel="stylesheet" href="adminlte.css" />
  <link rel="stylesheet" href="custom.css"/>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>

  <!-- ApexCharts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css"/>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

<!-- ================= MAIN ================= -->
<main class="app-main">

  <div class="app-content-header">
    <div class="container-fluid">
      <h3>Analytics & Reports</h3>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">

      <!-- KPI -->
      <div class="row mb-4">

        <div class="col-lg-3 col-6">
          <div class="small-box text-bg-primary">
            <div class="inner">
              <h3>1,240</h3>
              <p>Total Reports</p>
            </div>
            <i class="bi bi-file-bar-graph icon"></i>
          </div>
        </div>

        <div class="col-lg-3 col-6">
          <div class="small-box text-bg-success">
            <div class="inner">
              <h3>87%</h3>
              <p>Accuracy</p>
            </div>
            <i class="bi bi-check-circle icon"></i>
          </div>
        </div>

        <div class="col-lg-3 col-6">
          <div class="small-box text-bg-warning">
            <div class="inner">
              <h3>320</h3>
              <p>Generated</p>
            </div>
            <i class="bi bi-graph-up icon"></i>
          </div>
        </div>

        <div class="col-lg-3 col-6">
          <div class="small-box text-bg-danger">
            <div class="inner">
              <h3>12</h3>
              <p>Pending</p>
            </div>
            <i class="bi bi-hourglass"></i>
          </div>
        </div>

      </div>

      <!-- CHARTS -->
      <div class="row">

        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <h3>Trend Analysis</h3>
            </div>
            <div class="card-body">
              <div id="lineChart"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card">
            <div class="card-header">
              <h3>Status</h3>
            </div>
            <div class="card-body">
              <div id="donutChart"></div>
            </div>
          </div>
        </div>

      </div>

      <div class="row mt-4">

        <div class="col-lg-6">
          <div class="card">
            <div class="card-header">
              <h3>Departments</h3>
            </div>
            <div class="card-body">
              <div id="barChart"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card">
            <div class="card-header">
              <h3>Performance</h3>
            </div>
            <div class="card-body">
              <div id="radarChart"></div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

</main>

</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="custom.js"></script>
<script>
/* LINE */
new ApexCharts(document.querySelector("#lineChart"), {
  series: [{ name:"Reports", data:[10,20,15,30,25,40,35] }],
  chart: { type:"line", height:300 },
  xaxis: { categories:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] }
}).render();

/* DONUT */
new ApexCharts(document.querySelector("#donutChart"), {
  series:[45,25,20,10],
  labels:["Done","Pending","Process","Hold"],
  chart:{ type:"donut", height:300 }
}).render();

/* BAR */
new ApexCharts(document.querySelector("#barChart"), {
  series:[{ name:"Reports", data:[12,19,10,25,18] }],
  chart:{ type:"bar", height:300 },
  xaxis:{ categories:["HR","IT","Sales","Finance","Ops"] }
}).render();

/* RADAR */
new ApexCharts(document.querySelector("#radarChart"), {
  series:[{ name:"Score", data:[80,90,70,85,60] }],
  chart:{ type:"radar", height:300 },
  labels:["Quality","Speed","Accuracy","Efficiency","Cost"]
}).render();

/* THEME */
const toggle=document.getElementById("themeToggle");
const icon=document.getElementById("themeIcon");

toggle.addEventListener("click",e=>{
  e.preventDefault();
  document.body.classList.toggle("dark-mode");

  icon.classList.toggle("bi-moon-fill");
  icon.classList.toggle("bi-sun-fill");
});
</script>

</body>
</html>
