<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee Table</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="adminlte.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="employetable.css">

</head>

<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Content Wrapper -->
  <div class="content-wrapper">

    <!-- Content Header -->
    <section class="content-header">
      <div class="container-fluid">

        <div class="topbar">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="topbar-title">Employee Table</span>
          </div>

          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:.72rem;color:var(--muted)" id="topDate"></span>
          </div>
        </div>

      </div>
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">

        <!-- YOUR EMPLOYEE TABLE CONTENT STARTS -->

        <div class="page">

          <div class="stats-row">

            <div class="stat-card">
              <div class="stat-icon" style="background:var(--primary-l);color:var(--primary)">
                <i class="bi bi-people-fill"></i>
              </div>

              <div>
                <div class="stat-val" id="sc-total">3</div>
                <div class="stat-lbl">Total Employees</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background:var(--success-l);color:var(--success)">
                <i class="bi bi-check-circle-fill"></i>
              </div>

              <div>
                <div class="stat-val" id="sc-active">1</div>
                <div class="stat-lbl">Active</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background:var(--primary-l);color:var(--primary)">
                <i class="bi bi-arrow-repeat"></i>
              </div>

              <div>
                <div class="stat-val" id="sc-working">1</div>
                <div class="stat-lbl">Working</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background:var(--warning-l);color:var(--warning)">
                <i class="bi bi-clock-fill"></i>
              </div>

              <div>
                <div class="stat-val" id="sc-pending">1</div>
                <div class="stat-lbl">Pending</div>
              </div>
            </div>

          </div>

          <!-- TABLE CARD -->
          <div class="card-box">

            <div class="section-header">

              <div class="section-title">
                Employee Table
              </div>

              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#employeeModal">
                  <i class="bi bi-plus-circle"></i> Add Employee
                </button>

                <button class="btn btn-warning btn-sm" onclick="openEditEmpModal()">
                  <i class="bi bi-pencil-square"></i> Edit Employee
                </button>
              </div>

            </div>

            <!-- FILTERS -->
            <div class="row g-2 mb-4">

              <div class="col-md-5">
                <input type="text" id="empSearch" class="form-control" placeholder="🔍 Search employee...">
              </div>

              <div class="col-md-3">
                <select id="empDeptFilter" class="form-select">
                  <option value="all">All Departments</option>
                  <option value="ui design">UI Design</option>
                  <option value="frontend">Frontend</option>
                  <option value="backend">Backend</option>
                  <option value="developer">Developer</option>
                </select>
              </div>

              <div class="col-md-4">
                <select id="empStatusFilter" class="form-select">
                  <option value="all">All Status</option>
                  <option value="active">Active</option>
                  <option value="working">Working</option>
                  <option value="pending">Pending</option>
                </select>
              </div>

            </div>

            <!-- TABLE -->
            <div class="table-responsive">

              <table class="table align-middle">

                <thead>
                  <tr>
                    <th>#</th>
                    <th>Employee</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Email</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="empTableBody">

                  <!-- Your employee rows here -->

                </tbody>

              </table>

            </div>

          </div>

        </div>

        <!-- YOUR EMPLOYEE TABLE CONTENT ENDS -->

      </div>
    </section>

  </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- AdminLTE -->
<script src="adminlte.js"></script>

<!-- LOAD NAVBAR + SIDEBAR -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  Promise.all([
    fetch("navbar.html").then(r => r.text()),
    fetch("sidebar.html").then(r => r.text())
  ]).then(([navbar, sidebar]) => {

    document.getElementById("navbar").innerHTML = navbar;
    document.getElementById("sidebar").innerHTML = sidebar;

  });

});
</script>

<!-- YOUR EMPLOYEE TABLE JS -->
<script>

document.getElementById('topDate').textContent =
new Date().toLocaleDateString('en-IN', {
  day:'numeric',
  month:'short',
  year:'numeric'
});

</script>

</body>
</html>
