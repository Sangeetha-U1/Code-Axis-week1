<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Light Dashboard</title>

  <link rel="stylesheet" href="../css/adminlte.css">
  <link rel="stylesheet" href="../css/custom.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body class="layout-fixed sidebar-expand-lg bg-light">

<div class="app-wrapper p-3">

  <h3>Light Dashboard</h3>

  <div class="row mt-3">

    <div class="col-lg-3">
      <div class="small-box bg-primary text-white">
        <div class="inner"><h3>120</h3><p>Employees</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="small-box bg-success text-white">
        <div class="inner"><h3>94%</h3><p>Attendance</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="small-box bg-warning text-white">
        <div class="inner"><h3>18</h3><p>Projects</p></div>
      </div>
    </div>

    <div class="col-lg-3">
      <div class="small-box bg-danger text-white">
        <div class="inner"><h3>86%</h3><p>Tasks</p></div>
      </div>
    </div>

  </div>

  <div class="card mt-4">
    <div class="card-body">
      <div id="revenue-chart"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="../js/custom.js"></script>

</body>
</html>
